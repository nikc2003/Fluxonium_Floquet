[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composite-model-parallel"
version = "0.1.0"
description = "Parallel composite-model sweeps (fluxonium+resonator)."
readme = "description.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "h5py",
    "qutip",
    "scqubits",
    "matplotlib",
    "scipy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
